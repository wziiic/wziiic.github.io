<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <!-- 让网页在手机上也自适应显示 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>个人介绍</title>
  <style>
    /* ================= 全局基础样式 ================= */
    /* :root 里定义的变量是“CSS 变量”，后面可以用 var(--xxx) 重复使用，方便统一改颜色 */
    :root {
      --bg-deep: #fff0f5;      /* 背景最深色（淡淡的粉） */
      --bg-mid: #ffe4ec;       /* 背景中间色（淡粉） */
      --bg-light: #fffafc;     /* 背景浅色（接近白） */
      --accent-1: #ff8fab;     /* 主色调：淡粉色 */
      --accent-2: #ff5c8a;     /* 主色调：玫红色 */
      --accent-3: #f27fb5;     /* 点缀色：粉紫色 */
      --text-main: #4a3550;    /* 主文字颜色（深紫灰） */
      --text-sub: #a2849a;     /* 次要文字颜色（灰粉） */
      --card-bg: rgba(255, 255, 255, 0.72);  /* 卡片半透明白色 */
      --card-border: rgba(255, 140, 175, 0.35); /* 卡片边框（淡粉） */
    }

    /* 去掉浏览器默认的外边距和内边距，统一设置 */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      height: 100%;
    }

    body {
      /* 背景使用深色渐变，营造“科技/AI”氛围 */
      background: linear-gradient(135deg, var(--bg-deep), var(--bg-mid), var(--bg-light));
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif;
      color: var(--text-main);
      overflow: hidden; /* 禁止整体页面滚动，因为我们要用“幻灯片”方式切换两页 */
    }

    /* ================= 装饰性光斑（让背景更灵动） ================= */
    .blob {
      position: fixed;      /* 固定在屏幕，不随内容滚动 */
      border-radius: 50%;
      filter: blur(90px);   /* 高斯模糊，形成柔和光斑 */
      opacity: 0.5;
      z-index: 0;           /* 放在内容层下面 */
      pointer-events: none; /* 不拦截鼠标点击 */
    }
    .blob-1 { width: 420px; height: 420px; background: var(--accent-1); top: -120px; left: -120px; }
    .blob-2 { width: 380px; height: 380px; background: var(--accent-2); bottom: -100px; right: -100px; }

    /* ================= 幻灯片容器 ================= */
    .slides {
      position: relative;
      height: 100vh;
      width: 100%;
      z-index: 1; /* 盖在光斑上面 */
    }

    /* 每一“页”都是一个 section，默认淡出隐藏，通过 .active 类显示 */
    .slide {
      position: absolute;
      inset: 0;                 /* 铺满整个屏幕 */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 40px 24px;
      opacity: 0;               /* 默认透明 */
      transform: translateX(40px); /* 默认向右偏移一点 */
      transition: opacity 0.6s ease, transform 0.6s ease; /* 切换动画 */
      pointer-events: none;     /* 隐藏时不响应点击 */
    }
    .slide.active {
      opacity: 1;               /* 显示 */
      transform: translateX(0); /* 回到原位 */
      pointer-events: auto;
    }

    /* ================= 通用卡片样式（美化文本框） ================= */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      backdrop-filter: blur(12px); /* 毛玻璃效果 */
      -webkit-backdrop-filter: blur(12px);
      box-shadow: 0 12px 40px rgba(196, 120, 155, 0.20);
      padding: 28px 32px;
    }

    /* 标题通用样式 */
    .section-title {
      font-size: 26px;
      font-weight: 700;
      margin-bottom: 14px;
      /* 给标题做渐变文字效果 */
      background: linear-gradient(90deg, var(--accent-3), var(--accent-2));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    /* ================= 第一页：个人名片 ================= */
    .hero {
      text-align: center;
      max-width: 720px;
      width: 100%;
    }

    /* 顶部“徽章”小标签 */
    .badge {
      display: inline-block;
      padding: 8px 18px;
      border-radius: 999px;
      background: rgba(255, 140, 175, 0.18);
      border: 1px solid rgba(255, 92, 138, 0.4);
      color: #d6487f;
      font-size: 14px;
      letter-spacing: 2px;
      margin-bottom: 26px;
    }

    .hero h1 {
      font-size: 52px;
      font-weight: 800;
      margin-bottom: 12px;
      background: linear-gradient(90deg, #ff5c8a, #c86fb5);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .hero .subtitle {
      color: var(--text-sub);
      font-size: 18px;
      margin-bottom: 34px;
    }

    /* 个人信息网格：把学院/专业/学号排成一排（窄屏时自动换行） */
    .info-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
      margin-bottom: 30px;
    }
    .info-item {
      padding: 22px 16px;
      border-radius: 16px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      transition: transform 0.3s ease, border-color 0.3s ease;
    }
    .info-item:hover {
      transform: translateY(-6px);       /* 鼠标悬停时向上浮起 */
      border-color: var(--accent-3);
    }
    .info-item .label {
      font-size: 14px;
      color: var(--text-sub);
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    .info-item .value {
      font-size: 20px;
      font-weight: 700;
      color: var(--text-main);
    }

    /* 装饰横幅图片 */
    .banner {
      width: 100%;
      max-height: 240px;
      object-fit: cover;   /* 图片按比例裁剪填满，不变形 */
      border-radius: 18px;
      border: 1px solid var(--card-border);
      box-shadow: 0 12px 40px rgba(196, 120, 155, 0.20);
    }
    /* 图片下方的小字 */
    .banner-caption {
      margin-top: 12px;
      font-size: 13px;
      color: var(--text-sub);
      letter-spacing: 1px;
    }

    /* ================= 第二页：自我介绍 ================= */
    .about {
      max-width: 860px;
      width: 100%;
      /* 内容较多，允许内部滚动 */
      max-height: 100vh;
      overflow-y: auto;
      padding: 30px 8px 60px;
    }
    /* 隐藏滚动条但保留滚动功能，让页面更整洁 */
    .about::-webkit-scrollbar { width: 0; }

    /* 每一段文字就是一个“美化文本框” */
    .text-box {
      margin-bottom: 22px;
    }
    .text-box h3 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .text-box p {
      line-height: 1.9;      /* 行距，让文字更透气 */
      color: #6b5468;
      font-size: 16px;
    }

    /* 图片容器：单张图片和图片组通用 */
    .figure {
      margin: 26px 0;
      text-align: center;
    }
    .figure img {
      max-width: 100%;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      box-shadow: 0 12px 36px rgba(196, 120, 155, 0.22);
    }
    .figure .caption {
      margin-top: 10px;
      color: var(--text-sub);
      font-size: 13px;
      letter-spacing: 1px;
    }

    /* 图片画廊：把多张图排成一排 */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 14px;
      margin: 26px 0;
    }
    .gallery img {
      width: 100%;
      height: 160px;
      object-fit: cover;      /* 统一裁剪成相同大小 */
      border-radius: 14px;
      border: 1px solid var(--card-border);
      box-shadow: 0 8px 24px rgba(196, 120, 155, 0.20);
      transition: transform 0.3s ease;
    }
    .gallery img:hover {
      transform: scale(1.05); /* 悬停放大 */
    }

    /* ================= 第三页：作品与联系 ================= */
    /* 第三页的大标题 */
    .page-title {
      text-align: center;
      font-size: 30px;
      font-weight: 800;
      margin: 6px 0 26px;
      background: linear-gradient(90deg, var(--accent-2), var(--accent-3));
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    /* 卡片内部的信息网格（联系方式用）去掉多余的下边距 */
    .card .info-grid { margin-bottom: 0; }

    /* 结尾：文字框在左，图片在右 */
    .ending-row {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .ending-row .text-box {
      flex: 1;          /* 文字框占满剩余空间 */
      margin-bottom: 0; /* 取消 text-box 默认的下边距 */
    }
    .ending-img {
      width: 180px;
      height: auto;
      flex-shrink: 0;   /* 图片不被压缩变形 */
      border-radius: 16px;
      border: 1px solid var(--card-border);
      box-shadow: 0 8px 24px rgba(196, 120, 155, 0.20);
    }

    /* 作品卡片：图片在左，文字在右 */
    .work-row {
      display: flex;
      align-items: center;
      gap: 20px;
      margin-bottom: 22px; /* 和普通文本框保持一致的下边距 */
    }
    .work-row .text-box {
      flex: 1;
      margin-bottom: 0;
    }
    .work-figure {
      flex-shrink: 0;
      width: 200px;
      text-align: center;
    }
    .work-img {
      width: 100%;
      height: auto;
      border-radius: 16px;
      border: 1px solid var(--card-border);
      box-shadow: 0 8px 24px rgba(196, 120, 155, 0.20);
    }
    .work-caption {
      margin-top: 8px;
      font-size: 13px;
      color: var(--text-sub);
      letter-spacing: 1px;
    }
    /* 「AI大人的话」图片：限定宽度，缩小显示 */
    .ai-img {
      width: 260px;
    }

    /* ================= 第三页：快速导航（球体网格，Apple Watch 风格） ================= */
    /* 整页容器：铺满、隐藏溢出；球体靠鼠标移动来旋转方向 */
    .apps-page {
      position: absolute;
      inset: 0;              /* 铺满整个幻灯片区域 */
      overflow: hidden;      /* 图标转出屏幕就裁剪掉 */
      cursor: grab;          /* 提示可以按住拖动旋转 */
      user-select: none;     /* 禁止选中页面里的文字，避免拖动时把文字拖走 */
      -webkit-user-select: none;
    }
    .apps-page.dragging {
      cursor: grabbing;      /* 按住拖动时显示“抓住”的手型 */
    }

    /* 网格本身：位于屏幕正中心的一个“点”，图标都围绕它做球面分布 */
    .apps-grid {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 0;
      height: 0;
    }

    /* 定位槽：负责摆放图标位置 + 远近缩放（位置和缩放由 JS 每帧计算写入） */
    .app-slot {
      position: absolute;
      left: 0;
      top: 0;
      width: 80px;          /* 图标基准尺寸（和 JS 里的 BASE 保持一致） */
      height: 80px;
      opacity: 0;           /* 初始隐藏，等 JS 渲染第一帧再显示 */
      will-change: transform, opacity;
    }

    /* 圆形图标本体：负责鼠标经过放大、点击跳动（配色已调低饱和度） */
    .app-icon {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      border: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      color: #fff;
      /* 默认一个低饱和灰粉，JS 会按色板逐个替换 */
      background: linear-gradient(135deg, #c7a4b4, #b78ba0);
      box-shadow: 0 8px 22px rgba(120, 100, 110, 0.28);
      /* 用“回弹”缓动，放大时像果冻一样有弹性 */
      transition: transform 0.22s cubic-bezier(0.34, 1.56, 0.64, 1),
                  box-shadow 0.22s ease, filter 0.22s ease;
    }
    .app-icon .app-emoji { font-size: 30px; line-height: 1; }
    .app-icon .app-label {
      font-size: 12px;
      letter-spacing: 1px;
      text-shadow: 0 1px 2px rgba(0, 0, 0, 0.15);
    }

    /* 球体上的“图片卡片”：把第二页的配图变成圆形缩略图贴到球面上 */
    .app-icon.app-icon-pic {
      position: relative;
      overflow: hidden;       /* 把方形图片裁成圆形 */
      background: #fff;       /* 图片未加载时先显示白底 */
      padding: 0;
    }
    .app-icon-pic .app-pic {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;      /* 图片填满圆形，多余部分居中裁剪 */
      border-radius: 50%;
    }
    .app-icon-pic .app-label {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 10px 6px 5px;
      font-size: 11px;
      color: #fff;
      text-align: center;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: linear-gradient(to top, rgba(0, 0, 0, 0.55), transparent);
    }

    /* 鼠标经过：图标放大 + 阴影加深 + 微微变亮（“鼠标经过的反应”） */
    .app-slot:hover .app-icon {
      transform: scale(1.18);
      box-shadow: 0 16px 36px rgba(120, 100, 110, 0.4);
      filter: brightness(1.06);
    }

    /* 点击后的“跳动”动画：先弹大、再回弹，最后回到原位 */
    @keyframes appBounce {
      0%   { transform: scale(1); }
      30%  { transform: scale(1.4); }
      55%  { transform: scale(0.82); }
      75%  { transform: scale(1.15); }
      100% { transform: scale(1); }
    }
    .app-slot.bounce .app-icon {
      animation: appBounce 0.5s cubic-bezier(0.28, 0.84, 0.42, 1);
    }

    /* 导航页顶部小标题（不挡住下面的图标点击） */
    .apps-title {
      position: absolute;
      top: 34px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 5;
      pointer-events: none;
    }
    .apps-title h2 {
      font-size: 26px;
      font-weight: 800;
      background: linear-gradient(90deg, #b78ba0, #9c89b0); /* 低饱和渐变标题 */
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .apps-title p {
      margin-top: 6px;
      font-size: 13px;
      color: var(--text-sub);
      letter-spacing: 1px;
    }
    /* 标题下方的“收集网页币”提示：粉色、稍醒目，和货币呼应 */
    .apps-title .coin-tip {
      margin-top: 8px;
      font-size: 13px;
      font-weight: 600;
      color: var(--accent-2);
      letter-spacing: 1px;
    }
    /* “快速导航”标题右侧的小标签：提示“有图标的是可解锁内容” */
    .apps-title h2 .unlock-tip {
      display: inline-block;       /* 让胶囊按内容撑开，紧跟在标题文字右侧 */
      margin-left: 12px;           /* 与“快速导航”四个字之间留一点距离 */
      padding: 3px 11px;           /* 胶囊内边距，让文字不贴边 */
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.5px;
      color: #b78ba0;
      /* 父级 h2 用了“文字渐变透明”效果，这里要恢复成普通实色，否则字会看不见 */
      -webkit-text-fill-color: #b78ba0;
      background: rgba(255, 255, 255, 0.7);
      background-clip: border-box;
      -webkit-background-clip: border-box;
      border: 1px solid rgba(183, 139, 160, 0.45);
      border-radius: 999px;        /* 大圆角做出胶囊形状 */
      vertical-align: middle;      /* 让胶囊和标题文字在垂直方向上居中对齐 */
    }

    /* 点击图标后：球体弹性缩小（用“回弹”曲线，缩小时会轻微回弹） */
    .apps-grid {
      transition: transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .apps-grid.shrunk {
      transform: scale(0.45);
    }

    /* 详情文本框：一张“有厚度”的卡片，点击图标后弹出 */
    .app-detail {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%) translateY(26px) scale(0.9);
      width: min(540px, 86vw);
      max-height: 72vh;
      overflow-y: auto;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 22px;
      padding: 34px 34px 30px;
      z-index: 300;           /* 盖在球体和标题之上 */
      /* 用“底部几层实心阴影”营造卡片有厚度的立体感 */
      box-shadow:
        0 4px 0 #e6d5de,     /* 第一层浅色“侧面” */
        0 8px 0 #d8c3ce,     /* 第二层更深一点 */
        0 28px 60px rgba(110, 84, 100, 0.38); /* 最后一层是投影 */
      opacity: 0;
      pointer-events: none;
      user-select: text;      /* 详情里的文字允许选中复制 */
      transition: opacity 0.4s ease, transform 0.55s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .app-detail.show {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, -50%) translateY(0) scale(1);
    }
    /* 右上角关闭按钮 */
    .detail-close {
      position: absolute;
      top: 14px;
      right: 16px;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      border: none;
      background: rgba(150, 120, 135, 0.14);
      color: #8a6f7d;
      font-size: 18px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.2s ease;
    }
    .detail-close:hover {
      background: rgba(150, 120, 135, 0.26);
      transform: scale(1.08);
    }
    /* 详情卡里的大图：默认隐藏，只在打开“图片卡片”时显示 */
    .detail-pic {
      display: none;
      width: 100%;
      max-height: 40vh;
      object-fit: cover;
      border-radius: 14px;
      margin-bottom: 16px;
    }
    .detail-title {
      font-size: 24px;
      font-weight: 800;
      margin-bottom: 14px;
      padding-right: 40px;    /* 给右上角关闭按钮留位置 */
      background: linear-gradient(90deg, #b78ba0, #9c89b0);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .detail-text {
      line-height: 1.9;
      color: #6b5468;
      font-size: 16px;
      white-space: pre-line;   /* 保留文本里的换行符，让联系方式每项单独占一行 */
    }

    /* 动漫的“补充”小框：默认藏在主卡背后露出一角，点击后滑到主卡上方 */
    .detail-extra {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
      width: min(520px, 82vw);
      background: rgba(255, 255, 255, 0.97);
      border: 1px solid rgba(255, 255, 255, 0.85);
      border-radius: 20px;
      padding: 24px 28px 12px;  /* 底部留少一点，让“展开”标签更贴底、更容易完整露出来 */
      box-shadow:
        0 4px 0 #e6d5de,
        0 8px 0 #d8c3ce,
        0 28px 60px rgba(110, 84, 100, 0.4);
      z-index: 290;                 /* 默认在主卡(300)背后 */
      opacity: 0;
      pointer-events: none;
      /* top 由 JS 计算，用弹性曲线过渡 */
      transition: top 0.6s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.4s ease;
    }
    .detail-extra.show {
      opacity: 1;
      pointer-events: auto;
    }
    .detail-extra.expanded {
      z-index: 320;                 /* 展开后盖到主卡上方 */
    }
    .extra-body {
      line-height: 1.9;
      color: #6b5468;
      font-size: 15px;
    }
    .extra-tab {
      display: block;
      margin-top: 16px;
      width: 100%;
      padding: 10px 12px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #cfa9b8, #b78ba0);
      color: #fff;
      font-size: 14px;
      letter-spacing: 1px;
      cursor: pointer;
      transition: filter 0.2s ease, transform 0.2s ease;
    }
    .extra-tab:hover {

    /* ================= 网页币系统（散落收集 + 购买解锁） ================= */

    .coin-counter {
      position: fixed;
      top: 18px;
      right: 20px;
      z-index: 6000;          /* 盖在页面内容之上 */
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 8px 16px;
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 140, 175, 0.4);

      transition: transform 0.18s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .coin-counter .coin-ico { font-size: 20px; line-height: 1; }
    .coin-counter .coin-num { font-size: 18px; min-width: 20px; text-align: center; }
    /* 收到币时计数器“弹一下” */
    .coin-counter.pop { transform: scale(1.25); }

    /* 货币散落层：铺满全屏，但本身不拦截点击 */
    .coins-layer {
      position: fixed;
      inset: 0;
      z-index: 5000;
      pointer-events: none;
      overflow: hidden;
    }
    /* 单个网页币：可点击收集，带缓慢上下漂浮动画（粉色圆片，和网页风格统一） */
    .coin {
      position: absolute;
      width: 46px;
      height: 46px;
      border: none;
      background: radial-gradient(circle at 35% 30%, #ffd0df, var(--accent-2) 75%);
      border-radius: 50%;
      font-size: 26px;
      line-height: 46px;
      text-align: center;
      cursor: pointer;
      pointer-events: auto;   /* 货币本身可点击 */
      box-shadow: 0 4px 14px rgba(255, 92, 138, 0.45), inset 0 -3px 6px rgba(224, 84, 130, 0.35);
      animation: coinFloat 3s ease-in-out infinite;
    }
    /* 把金色硬币 emoji 调成粉色，避免和粉色圆片不搭 */
    .coin .coin-emoji {
      display: inline-block;
      filter: hue-rotate(295deg) saturate(0.85);
    }
    .coin:hover { transform: scale(1.15); }
    @keyframes coinFloat {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-8px); }
    }
    /* 点击收集瞬间：原地放大并淡出 */
    .coin.collected {
      animation: coinGot 0.4s ease forwards;
      pointer-events: none;
    }
    @keyframes coinGot {
      0%   { transform: scale(1); opacity: 1; }
      100% { transform: scale(1.6); opacity: 0; }
    }
    /* 飞向计数器的“飞行币”克隆 */
    .coin.fly {
      position: fixed;
      margin: 0;
      animation: none;
      transition: transform 0.65s cubic-bezier(0.3, 0.9, 0.4, 1), opacity 0.65s ease;
      pointer-events: none;
      z-index: 6500;

    /* 未解锁的网格：锁居中显示、整体灰暗 */

      font-size: 26px;
      filter: grayscale(1);
    }
    .app-icon.locked .app-label {
      color: #efe9ec;
      text-shadow: none;
    }
    /* 解锁瞬间：锁旋转甩开、图标弹一下并发出金光 */
    @keyframes unlockSpin {
      0%   { transform: scale(1) rotate(0deg); }
      45%  { transform: scale(1.35) rotate(-18deg); }
      100% { transform: scale(1) rotate(0deg); }
    }
    .app-icon.unlocking {
      animation: unlockSpin 0.62s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 0 26px rgba(255, 200, 90, 0.85);

    /* 购买确认弹窗：半透明遮罩 + 居中卡片 */
    .buy-modal {
      position: fixed;
      inset: 0;

    .buy-title { font-size: 20px; font-weight: 800; color: var(--text-main); }
    .buy-desc { margin: 14px 0 20px; font-size: 14px; color: var(--text-sub); line-height: 1.7; }
    .buy-desc b { color: var(--accent-2); }
    .buy-btns { display: flex; gap: 12px; }
    .buy-btn {
      flex: 1;
      padding: 11px 0;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;

    .buy-btn:hover { filter: brightness(1.05); transform: scale(1.03); }

    /* 轻提示条：从底部滑出，几秒后自动消失 */
    .toast {
      position: fixed;
      left: 50%;
      bottom: 96px;
      transform: translate(-50%, 20px);
      z-index: 11000;
      padding: 12px 22px;
      background: rgba(74, 53, 80, 0.92);
      color: #fff;
      font-size: 14px;
      letter-spacing: 1px;
      border-radius: 999px;
      box-shadow: 0 10px 30px rgba(60, 40, 60, 0.35);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); }

    /* ================= 底部导航 ================= */
    .nav {
      position: fixed;

  <script>
    // ============ 页面切换逻辑 ============
    // 把所有“页”和“圆点”都收集起来
    const slides = document.querySelectorAll('.slide');
    const dots = document.querySelectorAll('.dot');
    let current = 0; // 当前显示第几页（从 0 开始）

    // 核心函数：切换到第 index 页
    function goTo(index) {
      // 防止越界（小于 0 或大于最后一页）
      if (index < 0 || index >= slides.length) return;

      // 先移除所有页的 active 类，再给目标页加上
      slides.forEach(s => s.classList.remove('active'));
      dots.forEach(d => d.classList.remove('active'));
      slides[index].classList.add('active');
      dots[index].classList.add('active');

      current = index; // 更新当前页记录
    }

    // 上一页 / 下一页按钮
    document.getElementById('prevBtn').addEventListener('click', () => goTo(current - 1));
    document.getElementById('nextBtn').addEventListener('click', () => goTo(current + 1));

    // 点击圆点直接跳转
    dots.forEach(dot => {
      dot.addEventListener('click', () => goTo(Number(dot.dataset.index)));
    });

    // 键盘左右方向键翻页（演示时很方便）
    document.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') goTo(current - 1);
      if (e.key === 'ArrowRight') goTo(current + 1);
    });

    // 手机触摸滑动切换（轻量实现：记录手指按下和抬起的横坐标差）
    let touchX = 0;
    document.addEventListener('touchstart', (e) => {
      touchX = e.touches[0].clientX;
    });
    document.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - touchX;
      if (dx > 60) goTo(current - 1);      // 向右滑 -> 上一页
      else if (dx < -60) goTo(current + 1); // 向左滑 -> 下一页
    });

    // ============ 第三页：球体网格导航（Apple Watch 风格，低饱和配色） ============
    // 真实的导航条目（之后可以继续往这个数组里加）
    // emoji：图标表情；label：图标下的名字；detail：点击后详情卡里的正文

      {
        emoji: '📺',
        label: '动漫',
        detail: '刚刚入坑动画是在小时候看三大民工漫，为了不被发现所以起早贪黑抱着电脑看，全程不快进看完了火影海贼...后来五六年级那里被朋友带入宅（当时看的是物语系列），开智前喜欢看热血战斗番，当时进击的巨人出了三季，超级喜欢！还有就是情节构思精巧，全体智商在线的剧情作比如命运石之门和死亡笔记。开智以后又改风格，喜欢催泪感人的文艺动漫比如四谎，CLANNAD，可塑性记忆之类的...此外超级重力低气压扭曲误会感情纠葛复杂关系性一直在我的好球区，比如我特别特别喜欢的横枪萌果老师的人渣的本愿，还有魔圆，以及各大党争作。喜欢可爱的败犬角色，喜欢傲娇，喜欢粉毛，喜欢年上大姐姐，喜欢双马尾和黑长直，喜欢大腿袜...现在一般会看每个季度的新番，欢迎交流！',

      {
        emoji: '🎵',
        label: '音乐',

      },
      {
        emoji: '🎨',

    // 占位图标池：先把球体填满，等以后有真实内容再一个个替换掉
    const PLACEHOLDER_EMOJI = ['✦', '❀', '☾', '☁', '♡', '⚘', '❋', '✧', '☼', '✿', '◈', '❊'];
    const N = 40; // 图标总数，越多球体越“满”

    // 第二页的图片（已搬到球体上）：直接写死图片路径，做成“图片卡片”
    // 注意：用户要求图片不显示对应的文字标签，所以只保留 src，不带 label
    const page2Images = [
      'OIP-C.webp',
      'yuzusoft_Q/OIP-C (1).webp',
      'yuzusoft_Q/OIP-C (2).webp',
      'yuzusoft_Q/OIP-C (3).webp',
      'yuzusoft_Q/OIP-C (4).webp',
      'yuzusoft_Q/OIP-C (5).webp',
      'ff8648be-0dd5-7f0a-26d7-b1946c16924a.png',
      'OIP-C (1).webp',
    ].map(src => ({ src, image: true }));

    // 占位符池（未填写内容，带 placeholder 标记，点击不弹详情卡）
    const placeholders = [];
    for (let i = 0; i < N; i++) {
      placeholders.push({ emoji: PLACEHOLDER_EMOJI[i % PLACEHOLDER_EMOJI.length], placeholder: true });
    }

    // 把“文字条目（已填写）”和“图片”交错合并（文→图→文→图……），
    // 这样它们在球面上互相穿插，不会文字挤一边、图片挤另一边
    const filled = [];
    const mLen = Math.max(REAL_APPS.length, page2Images.length);
    for (let i = 0; i < mLen; i++) {
      if (REAL_APPS[i]) filled.push(REAL_APPS[i]);
      if (page2Images[i]) filled.push(page2Images[i]);
    }

    // 三类（文字 / 图片 / 占位符）交替铺满球面：
    // 已填写内容按“均匀步长”占位，并整体偏移半个步长，避免挤在北极一侧；
    // 它们之间的空位全部填占位符，实现三者均匀交替
    const apps = [];
    const gap = N / filled.length;
    let fi = 0, pi = 0;
    for (let i = 0; i < N; i++) {
      if (fi < filled.length && i === Math.round((fi + 0.5) * gap)) {
        apps.push(filled[fi++]);        // 放已填写内容（文字或图片）
      } else {
        apps.push(placeholders[pi++]);  // 放占位符（未填写）
      }
    }

    // 低饱和“莫兰迪”色板：每个图标循环用一组柔和的渐变色
    const NAV_COLORS = [
      ['#cfa9b8', '#b78ba0'],
      ['#b9a5c4', '#9c89b0'],
      ['#aab6c2', '#8b9dad'],
      ['#c8b7a5', '#ad967e'],
      ['#b6abb7', '#9b8f9d'],
      ['#c5acb6', '#a98e9b'],
    ];

    const appsPage = document.getElementById('page3');
    const appsGrid = document.getElementById('appsGrid');
    const appDetail = document.getElementById('appDetail');
    const detailTitle = document.getElementById('detailTitle');
    const detailText = document.getElementById('detailText');
    const detailPic = document.getElementById('detailPic');
    const detailClose = document.getElementById('detailClose');
    const detailExtra = document.getElementById('detailExtra');
    const extraBody = document.getElementById('extraBody');
    const extraTab = document.getElementById('extraTab');

    // ============ 网页币系统：散落收集 + 购买解锁 ============
    // 每次打开网页都从 0 币、全部锁定的新状态开始（不持久化，刷新即重新来一局）
    let webCoins = 0;      // 当前拥有的网页币数量
    let unlockedApps = []; // 本次会话里已经解锁的条目名
    // 判断某个“已填写内容”是否已解锁（只对文字条目生效，图片和占位符不参与）
    function isUnlocked(app) { return unlockedApps.includes(app.label); }

    const coinCounter = document.getElementById('coinCounter');
    const coinNum = document.getElementById('coinNum');
    const coinsLayer = document.getElementById('coinsLayer');
    const buyModal = document.getElementById('buyModal');
    const buyLabel = document.getElementById('buyLabel');
    const buyCoins = document.getElementById('buyCoins');
    const buyCancel = document.getElementById('buyCancel');
    const buyOk = document.getElementById('buyOk');
    const toast = document.getElementById('toast');

    // 刷新右上角计数器的数字，并播放“弹一下”动画
    function updateCounter() {
      coinNum.textContent = webCoins;
      coinCounter.classList.remove('pop');
      void coinCounter.offsetWidth; // 强制重排，让动画每次都能重新触发
      coinCounter.classList.add('pop');
    }

    // 轻提示条：底部滑出，约 2.4 秒后自动消失
    let toastTimer = null;
    function showToast(msg) {
      toast.textContent = msg;
      toast.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
    }

    // 当前正在被购买的条目（点击“确认支付”后用它们完成解锁）
    let buyingApp = null, buyingIcon = null;

    // 打开购买确认弹窗
    function openBuyModal(app, icon) {
      buyingApp = app;
      buyingIcon = icon;
      buyLabel.textContent = app.label;
      buyCoins.textContent = webCoins;
      buyModal.classList.add('show');
    }
    function closeBuyModal() {
      buyModal.classList.remove('show');
      buyingApp = null;
      buyingIcon = null;
    }

    // 点击“确认支付”：扣 1 币 → 解锁 → 播放衔接动画（自动弹出详情卡）
    function doUnlock() {
      if (!buyingApp || !buyingIcon) return;
      const app = buyingApp, icon = buyingIcon;
      closeBuyModal();

      webCoins -= 1;          // 扣掉一个网页币
      updateCounter();

      unlockedApps.push(app.label); // 标记为已解锁

      // 解锁动画：锁先旋转、甩开，再换成真实 emoji、恢复彩色背景
      icon.classList.add('unlocking');
      setTimeout(() => {
        const c = icon._color; // 创建图标时保存的配色
        icon.style.background = `linear-gradient(135deg, ${c[0]}, ${c[1]})`;
        icon.querySelector('.app-emoji').textContent = app.emoji;
        icon.classList.remove('locked');
      }, 380);
      // 衔接动画：解锁完成后，自动弹出该条目的详情卡
      setTimeout(() => {
        icon.classList.remove('unlocking');
        openDetail(app);
      }, 680);
    }

    // 尝试购买：币不够就提示去收集，币够就弹确认框
    function tryBuy(app, icon) {
      if (webCoins < 1) {
        showToast('🪙 网页币不足，去页面空白处收集网页币吧！');
        return;
      }
      openBuyModal(app, icon);
    }

    buyCancel.addEventListener('click', closeBuyModal);
    buyOk.addEventListener('click', doUnlock);
    // 点遮罩空白处也能取消
    buyModal.addEventListener('click', (e) => {
      if (e.target === buyModal) closeBuyModal();
    });

    // 在页面空白处随机撒网页币（避开中心球体/卡片和上下导航）
    const COIN_COUNT = REAL_APPS.length; // 散落币数 = 已填写内容数，刚好够全部解锁
    function scatterCoins() {
      const vw = window.innerWidth;
      const vh = window.innerHeight;
      const S = Math.min(vw, vh);
      for (let i = 0; i < COIN_COUNT; i++) {
        let x = 0, y = 0, ok = false;
        // 反复随机，直到落到中心内容区之外的空白处
        for (let t = 0; t < 60 && !ok; t++) {
          x = vw * (0.06 + Math.random() * 0.88);
          y = vh * (0.10 + Math.random() * 0.76);
          const dx = x - vw / 2;
          const dy = y - vh / 2;
          if (Math.sqrt(dx * dx + dy * dy) > S * 0.52 && y > 90 && y < vh - 90) ok = true;
        }
        const coin = document.createElement('button');
        coin.className = 'coin';
        coin.innerHTML = '<span class="coin-emoji">🪙</span>'; // 包一层，方便单独把硬币调成粉色
        coin.style.left = x + 'px';
        coin.style.top = y + 'px';
        coin.style.animationDelay = (Math.random() * 2.5).toFixed(2) + 's'; // 漂浮节奏错开
        coin.addEventListener('click', () => collectCoin(coin));
        coinsLayer.appendChild(coin);
      }
    }

    // 收集网页币：币原地消失 + 一个“飞行币”飞向右上角计数器
    function collectCoin(coin) {
      coin.classList.add('collected');
      const from = coin.getBoundingClientRect();
      const to = coinCounter.getBoundingClientRect();

      // 克隆一个币，从原位置飞向计数器
      const flyer = coin.cloneNode(true);
      flyer.classList.remove('collected');
      flyer.classList.add('fly');
      flyer.style.left = from.left + 'px';
      flyer.style.top = from.top + 'px';
      document.body.appendChild(flyer);
      // 下一帧再设置终点，浏览器才会播放过渡动画
      requestAnimationFrame(() => {
        flyer.style.transform = `translate(${to.left - from.left + (to.width - from.width) / 2}px, ${to.top - from.top + (to.height - from.height) / 2}px) scale(0.25)`;
        flyer.style.opacity = '0.2';
      });
      setTimeout(() => flyer.remove(), 700);

      webCoins += 1; // 币数 +1
      updateCounter();
      setTimeout(() => coin.remove(), 420); // 原币短暂动画后移除
    }

    updateCounter();      // 页面加载时先显示已有的币数
    scatterCoins();       // 撒币
    window.addEventListener('resize', () => {
      coinsLayer.innerHTML = ''; // 窗口变化时清空重撒，避免币跑到屏幕外
      scatterCoins();
    });

    const BASE = 80; // 图标基准尺寸，要和 CSS 里 .app-slot 的宽高一致

    // 逐个创建图标（定位槽 + 圆形图标）
    const slots = [];
    apps.forEach((app, i) => {
      const slot = document.createElement('div');
      slot.className = 'app-slot';

      const icon = document.createElement('button');
      icon.className = 'app-icon';
      // 只有“已填写内容”（文字条目）需要解锁；图片和占位符不参与锁定
      const lockable = !app.placeholder && !app.image;
      const locked = lockable && !isUnlocked(app);

      if (app.image) {
        // 图片卡片：只有圆形缩略图，不带文字标签，也不上锁
        icon.classList.add('app-icon-pic');
        icon.innerHTML = `<img class="app-pic" src="${app.src}" alt="配图" />`;
      } else {
        const c = NAV_COLORS[i % NAV_COLORS.length];
        icon._color = c; // 记住配色，解锁时要恢复彩色
        if (locked) {
          // 未解锁：背景灰暗 + 中间显示锁，名字保留（让人知道要解锁什么）
          icon.style.background = 'linear-gradient(135deg, #c9c2c6, #a99fa4)';
          icon.classList.add('locked');
          icon.innerHTML = `<span class="app-emoji">🔒</span>` + (app.label ? `<span class="app-label">${app.label}</span>` : '');
        } else {
          icon.style.background = `linear-gradient(135deg, ${c[0]}, ${c[1]})`; // 逐个上低饱和色
          icon.innerHTML = `<span class="app-emoji">${app.emoji}</span>` + (app.label ? `<span class="app-label">${app.label}</span>` : '');
        }
      }

      // 点击：先播放图标自身的小跳动
      // （占位图标和图片卡片都属于“尚未填写内容”，点击只跳动、不弹详情卡）
      icon.addEventListener('click', () => {
        slot.classList.add('bounce');
        setTimeout(() => slot.classList.remove('bounce'), 500);
        if (app.placeholder || app.image) return; // 占位符和图片只跳动
        if (isUnlocked(app)) openDetail(app);      // 已解锁 → 直接看内容
        else tryBuy(app, icon);                    // 未解锁 → 走购买流程
      });

      slot.appendChild(icon);
      appsGrid.appendChild(slot);
      slots.push(slot);
    });

    // 补充小框当前是否处于“展开到主卡上方”的状态
    let extraExpanded = false;

    // 点击图标：球体弹性缩小，弹出详情文本框
    function openDetail(app) {
      if (app.image) {
        // 图片卡片：详情里只显示大图，不带文字说明
        detailTitle.textContent = '🖼️ 配图';
        detailPic.src = app.src;
        detailPic.alt = '配图';
        detailPic.style.display = 'block';
        detailText.textContent = '';
      } else {
        detailTitle.textContent = app.label ? app.label : (app.emoji + ' 相关内容');
        detailPic.style.display = 'none';
        detailText.textContent = app.detail || '这里将展示与这个图标相关的内容（内容待添加）……';
      }
      appsGrid.classList.add('shrunk');
      appDetail.classList.add('show');

      // 如果这个条目带“补充”内容，就显示背后的补充小框（默认只露出一角）
      if (app.extra) {
        extraBody.textContent = app.extra;
        detailExtra.classList.add('show');
        extraExpanded = false;
        extraTab.textContent = '💗 点我展开补充';
        positionExtra(true); // 先藏在主卡背后，只露出一角
      } else {
        detailExtra.classList.remove('show');
      }
    }

    // 计算补充小框的位置：peek=true 只露一角；否则展开到主卡上方
    function positionExtra(peek) {
      const vh = window.innerHeight;
      const cardH = appDetail.offsetHeight;    // 主卡高度（不含缩放）
      const extraH = detailExtra.offsetHeight; // 补充框高度
      const cardTop = (vh - cardH) / 2;        // 主卡顶部（居中）
      const cardBottom = (vh + cardH) / 2;     // 主卡底部
      if (peek) {
        // 露角：把底部“标签”完整露出来（56px），其余藏在主卡背后
        detailExtra.style.top = (cardBottom + 56 - extraH) + 'px';
        detailExtra.classList.remove('expanded');
      } else {
        // 展开：整卡移到主卡上方，留 16px 间距
        detailExtra.style.top = (cardTop - extraH - 16) + 'px';
        detailExtra.classList.add('expanded');
      }
    }

    // 切换补充小框：露角 ⇄ 展开到主卡上方
    function toggleExtra() {
      extraExpanded = !extraExpanded;
      extraTab.textContent = extraExpanded ? '✕ 收起补充' : '💗 点我展开补充';
      positionExtra(!extraExpanded);
    }
    // 点“标签”按钮：展开 / 收起（阻止冒泡，避免和下面的整框点击重复触发）
    extraTab.addEventListener('click', (e) => {
      e.stopPropagation();
      toggleExtra();
    });
    // 露角状态时，点露出的任意位置也能展开（此时正文被主卡挡住，不会误触）
    detailExtra.addEventListener('click', () => {
      if (!extraExpanded) toggleExtra();
    });

    // 点击右上角 ✕：关闭详情，球体弹性恢复
    detailClose.addEventListener('click', () => {
      appsGrid.classList.remove('shrunk');
      appDetail.classList.remove('show');
      detailExtra.classList.remove('show');
      detailExtra.classList.remove('expanded');
      extraExpanded = false;
      extraTab.textContent = '💗 点我展开补充';
    });

    // ===== 球体参数与均匀分布 =====
    // 用“斐波那契球体分布”，让 N 个点尽量均匀地铺在球面上
    let R, D;              // R 球体半径；D 观察者到球心的距离
    let points = [];       // 每个图标在“单位球面”上的坐标（实际坐标 = R 倍）

    function setupSphere() {
      const vw = appsPage.clientWidth;
      const vh = appsPage.clientHeight;
      const S = Math.min(vw, vh);
      R = S * 0.46;        // 球体半径，想让球体更大就把系数调大
      D = R * 2.4;         // 观察者距离，越小透视（近大远小）越强烈

      const GOLDEN = Math.PI * (3 - Math.sqrt(5)); // 黄金角，让点错开得更均匀
      points = apps.map((_, i) => {
        const t = apps.length > 1 ? i / (apps.length - 1) : 0;
        const y = 1 - t * 2;               // y 从 1 到 -1
        const rAtY = Math.sqrt(1 - y * y); // 该高度横截面的半径
        const th = i * GOLDEN;
        return { x: Math.cos(th) * rAtY, y, z: Math.sin(th) * rAtY };
      });
    }
    setupSphere();
    window.addEventListener('resize', setupSphere); // 窗口大小变化时重新分布

    // ===== 旋转 + 渲染 =====
    // 自转角度（空闲时慢慢增加）和用户按住左键拖动产生的偏移角度
    let autoRotY = 0.2;   // 绕 Y 轴自转，初始给个小角度
    let userRotX = -0.12; // 绕 X 轴（上下），初始微仰，看起来立体
    let userRotY = 0;     // 绕 Y 轴（左右），由拖动改变

    let dragging = false; // 是否按住左键在拖动
    let lastX = 0, lastY = 0; // 上一次鼠标位置

    // 按住鼠标左键 → 开始转动球体
    appsPage.addEventListener('mousedown', (e) => {
      if (e.button !== 0) return; // 只响应左键
      e.preventDefault(); // 阻止默认行为：避免拖动时选中文字、把文字拖到浏览器搜索框
      dragging = true;
      lastX = e.clientX;
      lastY = e.clientY;
      appsPage.classList.add('dragging');
    });
    // 再兜底阻止一次“拖拽文字”的默认行为
    appsPage.addEventListener('dragstart', (e) => e.preventDefault());
    // 拖动过程中 → 按鼠标移动量转动球体
    window.addEventListener('mousemove', (e) => {
      if (!dragging) return;
      const dx = e.clientX - lastX;
      const dy = e.clientY - lastY;
      lastX = e.clientX;
      lastY = e.clientY;
      userRotY += dx * 0.005; // 拖动灵敏度，越大转得越快
      userRotX += dy * 0.005;
    });
    // 松开左键 → 停止拖动，球体继续自己慢慢转
    window.addEventListener('mouseup', () => {
      dragging = false;
      appsPage.classList.remove('dragging');
    });

    // 每一帧：空闲时让球体缓慢自转，再旋转、投影到屏幕
    function render() {
      if (!dragging) autoRotY += 0.0015; // 没有交互时绕 Y 轴慢慢自转
      const rotY = autoRotY + userRotY;  // 总绕 Y 轴角度 = 自转 + 拖动
      const rotX = userRotX;             // 总绕 X 轴角度（上下）

      const cosY = Math.cos(rotY), sinY = Math.sin(rotY);
      const cosX = Math.cos(rotX), sinX = Math.sin(rotX);

      points.forEach((p, i) => {
        const slot = slots[i];

        // 第一步：绕 Y 轴旋转
        const x1 = p.x * cosY + p.z * sinY;
        const z1 = -p.x * sinY + p.z * cosY;
        const y1 = p.y;
        // 第二步：绕 X 轴旋转
        const y2 = y1 * cosX - z1 * sinX;
        const z2 = y1 * sinX + z1 * cosX;
        const x2 = x1;

        // 透视投影：z2 越小（越靠近观察者）放大倍数越大
        const scale = D / (D + z2 * R);
        const sx = x2 * R * scale;   // 屏幕横坐标（相对屏幕中心）
        const sy = y2 * R * scale;   // 屏幕纵坐标（相对屏幕中心）

        const depth = (z2 + 1) / 2;             // 0 = 最近，1 = 最远
        const opacity = 1 - depth * 0.85;       // 近实远虚

        // 把图标放到投影位置，并按远近缩放
        if (apps[i].image) {
          // 图片卡片额外做“微量畸变”：越靠球体边缘，图片在对应方向被轻微压扁，
          // 让图片看起来是“贴”在球面上的
          const kx = 1 - (1 - Math.sqrt(1 - x2 * x2)) * 0.35; // 水平方向压缩
          const ky = 1 - (1 - Math.sqrt(1 - y2 * y2)) * 0.35; // 垂直方向压缩
          slot.style.transform = `translate(${sx - BASE / 2}px, ${sy - BASE / 2}px) scale(${scale}) scaleX(${kx.toFixed(3)}) scaleY(${ky.toFixed(3)})`;
        } else {
          slot.style.transform = `translate(${sx - BASE / 2}px, ${sy - BASE / 2}px) scale(${scale})`;
        }
        slot.style.opacity = opacity.toFixed(3);
        slot.style.zIndex = Math.round((1 - depth) * 200); // 近的盖住远的
        slot.style.pointerEvents = z2 > 0.15 ? 'none' : 'auto'; // 转到背面就不让点
      });

      requestAnimationFrame(render);
    }
    requestAnimationFrame(render);
  </script>
</body>
</html>
